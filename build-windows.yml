name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    paths:
      - 'app.py'
      - '.github/workflows/build-windows.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install PyInstaller
        run: python -m pip install pyinstaller
      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --console --name KBO_UNIVERSE app.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: KBO_UNIVERSE_Windows
          path: dist/KBO_UNIVERSE.exe
